{{ define "main" }}
  <article>
    <header class="post-header">
      <h1>{{ .Title }}</h1>
      {{- if and .Date (not .Date.IsZero) }}
        <p class="post-meta">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
          · {{ .ReadingTime }} min read
        </p>
      {{- end }}
    </header>

    {{ .Content }}

    <footer class="post-footer">
      <a class="back" href="{{ "/posts/" | relURL }}">← all posts</a>
      {{- with .GetTerms "tags" }}
        <ul class="tags">
          {{- range . }}<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}
        </ul>
      {{- end }}
    </footer>
  </article>
{{ end }}
