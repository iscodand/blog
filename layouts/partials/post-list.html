{{- /* Recebe um slice de pages. Usado na home, em /posts/ e nas tags. */ -}}
<ul class="post-list">
  {{- range . }}
    <li>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02, 2006" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
  {{- end }}
</ul>
